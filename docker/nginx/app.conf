upstream php {
    server php:9000;
}

upstream node {
    server node:5173;
}

server {
    listen 80;

    server_name _;

    client_max_body_size 100M;

    root /var/www/public;

    location /api/ {
        try_files $uri /index.php$is_args$args;
    }

    location /horizon {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        fastcgi_read_timeout 600;
        fastcgi_pass php;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        include fastcgi_params;
    }

    # Block direct requests to dotfiles at the URL root (e.g. /.env, /.git/config).
    # Anchored to the start so it doesn't catch Vite's internal paths like
    # /node_modules/.vite/deps/*, which legitimately contain "/." mid-path.
    location ~ ^/\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location / {
        proxy_pass http://node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Vite HMR websocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
